apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: host
      value: "amqp://guest:guest@localhost:5672"
    - name: durable
      value: "true"
    - name: prefetchCount
      value: "0"
    - name: reconnectWait
      value: "0"
    - name: deleteWhenUnused
      value: "false"
scopes:
  - productservice
